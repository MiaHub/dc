      /* Keep the page locked to the screen on phones: the click blast animation and
         the typed text must not make the page wider, which made mobile browsers zoom. */
      html, body { overflow: hidden; touch-action: manipulation; }

      #canvas { position: absolute; top: 0; left: 0; display: block; }

          await waitForMs(4000);

          }
          myFunction("button")
